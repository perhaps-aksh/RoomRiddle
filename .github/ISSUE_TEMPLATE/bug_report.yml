name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [TV app (Vega), Phone app, Server, AI suspects / voices, A case's content, Docs]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Create a room on the TV\n2. Join from a phone\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Fire TV Stick 4K Max / Vega Virtual Device; phone browser; commit"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove any API keys.
